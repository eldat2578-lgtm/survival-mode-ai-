
name: SURVIVAL MODE Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator
        run: python generate.py

      - name: Save topic history
        run: |
          git config user.name "SURVIVAL MODE Bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_history.txt
          git diff --cached --quiet || git commit -m "Save generated topic history"
          git push