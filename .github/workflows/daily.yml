
name: SURVIVAL MODE Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator
        run: python generate.py