


name: SURVIVAL MODE Automation

on:
  push:
    branches: [upgrade/polished-2d-renderer]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: survival-mode-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run generator
        run: python generate.py

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: SURVIVAL-MODE-Videos
          path: videos/*.mp4
          retention-days: 30

      - name: Save generated files
        run: |
          git config user.name "SURVIVAL MODE Bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_history.txt scripts/
          git diff --cached --quiet || git commit -m "Save generated content"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
