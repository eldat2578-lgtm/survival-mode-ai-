name: Validate generator

on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/polished-2d-renderer]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile generate.py audio_track.py
      - name: Check required imports
        run: python -c "import PIL, imageio, numpy, edge_tts"
